name: Build MaxQ (Windows & Core Tests)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sing-box v1.14.4 Linux validator
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz -o /tmp/sb.tar.gz
          tar -xzf /tmp/sb.tar.gz -C /tmp
          mv /tmp/sing-box-1.14.4-linux-amd64/sing-box "$HOME/.local/bin/sing-box"
          chmod +x "$HOME/.local/bin/sing-box"
          "$HOME/.local/bin/sing-box" version
      - name: Run full Rust workspace test suite
        run: cargo test --workspace

  build-windows:
    runs-on: windows-latest
    needs: core-tests-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Download & SHA-256 verify sing-box v1.14.4 Windows amd64 sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/resources
          $url = "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile sing-box.zip
          Expand-Archive -Path sing-box.zip -DestinationPath sb_tmp -Force
          Copy-Item sb_tmp/sing-box-1.14.4-windows-amd64/sing-box.exe apps/desktop/src-tauri/resources/sing-box.exe
          $hash = (Get-FileHash apps/desktop/src-tauri/resources/sing-box.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "sing-box.exe SHA256: $hash"
          if ($hash -ne "8f30682ee198855440d2a7fe070d5d3653793b2d01bb8c85eea88f93bbe7c8b9") {
            throw "sing-box.exe SHA-256 verification failed!"
          }
      - name: Build hardened Windows TUN service (maxq-service.exe)
        shell: pwsh
        run: |
          cargo build --release -p maxq-win-service --bin maxq-service
          Copy-Item target/release/maxq-service.exe apps/desktop/src-tauri/resources/maxq-service.exe
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --no-frozen-lockfile
      - name: Build Tauri v2 Windows installers (NSIS & MSI)
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2 build
      - name: Package self-contained portable Windows zip & SHA256SUMS.txt
        shell: pwsh
        run: |
          $distDir = "apps/desktop/src-tauri/target/release/release-assets"
          $portableDir = "apps/desktop/src-tauri/target/release/portable-staging/MaxQ-portable"
          New-Item -ItemType Directory -Force -Path "$portableDir/resources"
          New-Item -ItemType Directory -Force -Path $distDir
          Copy-Item apps/desktop/src-tauri/target/release/maxq-desktop.exe "$portableDir/maxq-desktop.exe"
          Copy-Item apps/desktop/src-tauri/resources/sing-box.exe "$portableDir/resources/sing-box.exe"
          Copy-Item apps/desktop/src-tauri/resources/maxq-service.exe "$portableDir/resources/maxq-service.exe"
          Copy-Item LICENSE "$portableDir/LICENSE"
          Copy-Item THIRD_PARTY_NOTICES.md "$portableDir/THIRD_PARTY_NOTICES.md"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "$distDir/MaxQ-portable-win64.zip" -Force

          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe $distDir/
          Copy-Item apps/desktop/src-tauri/target/release/bundle/msi/*.msi $distDir/

          $sums = Get-ChildItem -Path $distDir -File | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $sums | Out-File -FilePath "$distDir/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$distDir/SHA256SUMS.txt"
      - name: Upload Windows installers & portable archive
        uses: actions/upload-artifact@v4
        with:
          name: maxq-windows-amd64
          path: apps/desktop/src-tauri/target/release/release-assets/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - name: Download built Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: maxq-windows-amd64
          path: release-assets
      - name: Upload installers & SHA256SUMS.txt to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "MaxQ $TAG" --generate-notes
          fi
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
