[package]
name = "maxq-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
maxq-core-model = { path = "../../../crates/core-model" }
maxq-parser = { path = "../../../crates/parser" }
maxq-sanitizer = { path = "../../../crates/sanitizer" }
maxq-cert-probe = { path = "../../../crates/cert-probe" }
maxq-singbox-compiler = { path = "../../../crates/singbox-compiler" }
maxq-storage = { path = "../../../crates/storage" }
maxq-core-runtime = { path = "../../../crates/core-runtime" }
